<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Happy 21 Day</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <img
  class="decor-heart decor-heart--1"
  src="./images/hearts/heart-1.svg"
  alt=""
  aria-hidden="true"
>

<img
  class="decor-heart decor-heart--2"
  src="./images/hearts/heart-2.svg"
  alt=""
  aria-hidden="true"
>

<img
  class="decor-heart decor-heart--3"
  src="./images/hearts/heart-3.svg"
  alt=""
  aria-hidden="true"
>

    <!-- Верхняя карточка -->
    <section class="card hero">

      <div class="hero__title">
        <p>HAPPY</p>
        <p class="hero__age">21</p>
        <p>DAY</p>
      </div>

      <img
        class="hero__photo"
        src="images/girl.png"
        alt="Фотография именинницы"
      >

    </section>

    <!-- Нижняя карточка -->
    <section class="card invitation">

      <h2>КОГДА?</h2>

      <img
       class="calendar-image"
       src="./images/calendar.png"
       alt="Календарь на август 2026 года"
      >

      <p class="date">08.08.2026</p>

      <h2>ВО СКОЛЬКО?</h2>
      <p>19:30</p>

      <h2>ГДЕ?</h2>

      <p class="address">
        ресторан «Beluga»<br>
        Ульяновский Спуск, д. 41
      </p>

      <img
       class="location-heart"
       src="./images/hearts/heart-4.svg"
       alt=""
       aria-hidden="true"
       >

      <form class="invite-form">

        <h2>Ты придёшь?</h2>

       <label class="answer-option">
  <input
    class="answer-input"
    type="radio"
    name="answer"
    value="yes"
  >

  <img
    class="answer-heart"
    src="./images/hearts/heart-5.svg"
    alt=""
  >

  <span>Да!</span>
</label>

<label class="answer-option">
  <input
    class="answer-input"
    type="radio"
    name="answer"
    value="no"
  >

  <img
    class="answer-heart"
    src="./images/hearts/heart-6.svg"
    alt=""
  >

  <span>Нет(</span>
</label>

        <button type="submit">
          ОТПРАВИТЬ
        </button>

      </form>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
